<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Resizer & Frame Overlay</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <h1>Image Optimizer & Framer</h1>
      <p>Kompres, atur ukuran, dan gabungkan gambar dengan background secara otomatis.</p>
    </header>

    <main class="main-content">
      <!-- Section Upload -->
      <section class="upload-section">
        <div class="drop-zone" id="drop-zone">
          <input type="file" id="img-input" accept="image/*" class="file-input" />
          <div class="drop-zone-prompt">
            <svg class="upload-icon" viewBox="0 0 24 24">
              <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/>
            </svg>
            <p><strong>Pilih gambar</strong> atau seret file ke sini</p>
            <span>Format yang didukung: JPG, PNG, WEBP</span>
          </div>
        </div>

        <!-- Controls / Settings -->
        <div class="controls-panel">
          <div class="control-group">
            <label for="quality-range">Kualitas Kompresi: <span id="quality-val">40%</span></label>
            <input type="range" id="quality-range" min="0.1" max="1.0" step="0.05" value="0.4">
          </div>

          <div class="control-group dual-inputs">
            <div>
              <label for="max-width">Max Width (px)</label>
              <input type="number" id="max-width" value="1200" min="100" max="4000">
            </div>
            <div>
              <label for="max-height">Max Height (px)</label>
              <input type="number" id="max-height" value="1200" min="100" max="4000">
            </div>
          </div>

          <button id="process-btn" class="btn btn-primary" disabled>Proses & Download</button>
        </div>
      </section>

      <!-- Section Preview & Output -->
      <section class="preview-section">
        <div class="canvas-wrapper">
          <canvas id="canvas"></canvas>
          <div id="loader" class="loader hidden">Memproses...</div>
        </div>

        <div class="info-card hidden" id="info-card">
          <h3>Informasi File</h3>
          <div class="info-grid">
            <div>
              <span>Ukuran Asli:</span>
              <strong id="orig-size">-</strong>
            </div>
            <div>
              <span>Hasil Kompresi:</span>
              <strong id="comp-size">-</strong>
            </div>
            <div>
              <span>Penghematan:</span>
              <strong id="saved-ratio" class="highlight">-</strong>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="main.js"></script>
</body>
</html>
